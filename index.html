<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>Anniversary Adventure</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <main class="app">

        <!-- ============================= -->
        <!-- SCAVENGER HUNT LIST            -->
        <!-- ============================= -->

        <section id="huntScreen" class="screen">

            <header class="app-header">

                <p class="eyebrow">
                    Our Anniversary
                </p>

                <h1>
                    Adventure ❤️
                </h1>

                <p class="subtitle">
                    Find the things. Complete the challenges.
                </p>

                <div class="progress-area">

                    <span id="progressText">
                        0 of 25 completed
                    </span>

                    <div class="progress-bar">

                        <div id="progressFill"></div>

                    </div>

                </div>

            </header>


            <!-- The JavaScript will put the 25 items here -->

            <section id="gameBoard"
                     class="scavenger-list">
            </section>


            <!-- Completion message -->

            <section id="completionMessage"
                     class="completion-message hidden">

                <h2>
                    We did it! ❤️
                </h2>

                <p>
                    You found them all!
                    Now it's time to celebrate.
                </p>

                <button id="restartButton">
                    Start Over
                </button>

            </section>

        </section>


        <!-- ============================= -->
        <!-- PHOTO / CHALLENGE SCREEN       -->
        <!-- ============================= -->

        <section id="challengeScreen"
                 class="challenge-screen hidden">

            <div class="challenge-progress">

                <div id="challengeProgressBar"></div>

            </div>


            <div class="photo-container">

                <img id="challengeImage"
                     src=""
                     alt="A memory from our adventures">

            </div>


            <div class="challenge-text">

                <p id="challengeObserve"
                   class="challenge-observe">
                </p>

                <h2 id="challengeQuestion">
                </h2>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
